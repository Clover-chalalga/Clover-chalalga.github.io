        /* 1 СТРАНИЦА: ОБЛОЖКА */

            cursor: pointer;
            box-shadow: 0 10px 25px rgba(217, 119, 6, 0.4);
            transition: transform 0.2s, background-color 0.2s;
        }
        .btn-open:active {
            transform: scale(0.96);
        }
